<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Note Taker</title>
  <link rel="stylesheet" href="transcribing.css">
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <div class="icon" id="icon">●</div>
    <div class="copy">
      <div class="eyebrow" id="eyebrow">AI NOTE TAKER</div>
      <h1 id="title">Your meeting is being transcribed</h1>
      <p id="detail">Microphone capture is active. This notice will close automatically.</p>
    </div>
    <div class="progress"><span></span></div>
  </main>
  <script src="transcribing.js"></script>
</body>
</html>
